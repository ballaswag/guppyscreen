[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
# if not defined via environment variable will read this
invert_z_icon: false
prompt_emergency_stop: true
show_screws_tilt: true
display_sleep_sec: 600
# log levels are info, debug, trace
log_level: info
# if not defined via environment variable will read this
display_rotate: 3
# for displaying the current chamber temp
chamber_temp_sensor: temperature_sensor chamber_temp
# comma-separated extruder panel button values
extruder_temp_presets: 200, 220, 240, 260, 280, 300
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5
# with more than one extruder the extruder panel gets dropdown to pick one.
# true runs that extruder's T macro (multi toolhead), false ACTIVATE_EXTRUDER
extruder_select_tool_change: false
# colour console lines by kind: errors, sent commands, echo output, warnings
# and prompt lines, in the theme's colours
console_colors: true

# blue = primary_colour: 0x2196F3, secondary_colour: 0xF44336
# green = primary_colour: 0x4CAF50, secondary_colour: 0xF44336
# pink = primary_colour: 0xFEC5E5, secondary_colour: 0xE91E63
# purple = primary_colour: 0x9C27B0, secondary_colour: 0xF44336
# red = primary_colour: 0xF44336, secondary_colour: 0xF44336
# yellow = primary_colour: 0xFFEB3B, secondary_colour: 0xF44336
# The whole palette, all 0xRRGGBB. Every key is required: there are no colours
# in the code to fall back on. To restyle, override keys in your override
# file; you do not need to repeat the ones you keep.
#
# accents: blue = 0x2196F3, green = 0x4CAF50, pink = 0xFEC5E5, purple = 0x9C27B0,
#          red = 0xF44336, yellow = 0xFFEB3B (light accents want a dark
#          on_primary_colour)
[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336
# the page, and panels/cards sitting on it
bg_colour: 0x282B30
surface_colour: 0x282B30
# buttons, and anything lifted off the page
raised_colour: 0x2F3237
# the slot behind the selected nav tab
selected_colour: 0x9E9E9E
border_colour: 0x2F3237
border_dim_colour: 0x616161
text_colour: 0xFAFAFA
text_dim_colour: 0x9E9E9E
# the glyph on a tile at rest (stop, shutdown and the like wear danger_colour)
icon_colour: 0xFFFFFF
disabled_colour: 0x757575
# text and glyphs drawn on the primary colour
on_primary_colour: 0xFFFFFF
danger_colour: 0xD32F2F
warning_colour: 0xFFA000
success_colour: 0x388E3C
info_colour: 0x1976D2

[mmu]
# AFC and Happy Hare are detected when Klipper connects. Without an MMU,
# Spoolman navigation is added if its Moonraker component is configured.
# Comma-separated materials for the lane edit screen: the first few show
# inline, the rest appear in the "more materials" popout
materials: PLA, PETG, ABS, TPU, PLA+, PLA-CF, PETG-CF, ABS-CF, ASA, PC, PA, PA-CF, PVA, HIPS

[moonraker]
host: 127.0.0.1
port: 7125
# set this if host is not 127.0.0.1 / localhost or you want to download thumbnails
thumbnail_path:

[commands]
factory_reset_cmd: /etc/init.d/S58factoryreset reset
gui_restart_cmd: /etc/init.d/S99grumpyscreen restart
switch_to_stock_cmd: /usr/data/pellcorp/k1/switch-to-stock.sh
support_zip_cmd: /usr/data/pellcorp/tools/support.sh
restart_wifi_cmd: /usr/data/pellcorp/k1/tools/restart_wifi.sh

[fan "fan_generic part"]
display_name: Toolhead

[fan "output_pin fan0"]
display_name: Toolhead

[fan "fan"]
display_name: Toolhead

[fan "fan_generic chamber"]
display_name: Chamber

[fan "output_pin fan1"]
display_name: Chamber

[fan "fan_generic auxiliary"]
display_name: Auxiliary

[fan "output_pin fan2"]
display_name: Auxiliary

[led "output_pin LED"]
display_name: LED
pwm: false

[led "output_pin red_pin"]
display_name: Red
pwm: false

[led "output_pin green_pin"]
display_name: Green
pwm: false

[led "output_pin yellow_pin"]
display_name: Yellow
pwm: false

[led "output_pin light_pin"]
display_name: Light
pwm: false

[monitored_sensor "extruder"]
display_name: Extruder
color: red
controllable: true

# Add one section per additional Klipper extruder.
# [monitored_sensor "extruder1"]
# display_name: Extruder 1
# color: orange
# controllable: true

[monitored_sensor "heater_bed"]
display_name: Bed
color: purple
controllable: true

[monitored_sensor "temperature_fan chamber_fan"]
display_name: Chamber
color: blue
controllable: true

